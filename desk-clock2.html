<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desk Digital Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Darumadrop+One&family=Denk+One&family=DynaPuff:wght@400..700&family=Fira+Code:wght@300..700&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Luckiest+Guy&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet"> -->
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Barriecito&family=Boldonse&family=Cherry+Bomb+One&family=Darumadrop+One&family=Denk+One&family=DynaPuff:wght@400..700&family=Fira+Code:wght@300..700&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Luckiest+Guy&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Tourney:ital,wght@0,100..900;1,100..900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <style>
    body {
/*      font-family: "ZCOOL QingKe HuangYou", sans-serif;*/
      font-family: "Cherry Bomb One", system-ui;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('/assets/img/clock-bg-3.png');
      background-size: cover;
    background-position: center;
      color: #fff;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #clock span {
      display: inline-block;
      width: 1ch; /* fixed width equal to one character */
      text-align: center; /* center digits in the span */
      transform: scaleY(1.3);
    }


    #clock {
      font-weight: 400;
      font-style: normal;
      font-size: 200px;
      /*padding: 20px;
      border: 3px solid #fff;
      border-radius: 10px;
      background-color: #333;*/
      display: flex;*/
      gap: 5px;*/
    }
    /* Different colors for each digit */
    #clock span:nth-child(1) { color: #FFFFFF; } /* Hour tens */
    #clock span:nth-child(2) { color: #FFFFFF; } /* Hour ones */
    #clock span:nth-child(3) { color: #FFFFFF; }     /* Colon */
    #clock span:nth-child(4) { color: #FFFFFF; } /* Minute tens */
    #clock span:nth-child(5) { color: #FFFFFF; } /* Minute ones */
    #clock span:nth-child(6) { color: #FFFFFF; }     /* Colon */
    #clock span:nth-child(7) { color: #FFFFFF ; } /* Second tens */
    #clock span:nth-child(8) { color: #FFFFFF; } /* Second ones */

    #date {
      font-family: "ZCOOL QingKe HuangYou", sans-serif;
      font-size: 30px;
      margin-top: 20px;
      color: #ccc;
      text-align: center;
      width: 30%;
      padding: 20px;
      //border: 3px solid #fff;
      border-radius: 10px;
      background-color: rgba(128, 128, 128, 0.5);
    }
    .hidden {
      visibility: hidden;
    }
    #ampm {
      font-size: 48px;
      color: #FFFFFF;
      margin-left: 10px;
      font-family: inherit;
      align-self: flex-end;
    }
    .fullscreen-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(128, 128, 128, 0.5);
      color: #fff;
      border: none;
      font-size: 30px;
      padding: 8px 24px;
      cursor: pointer;
      border-radius: 8px;
      z-index: 2;
      transition: background 0.2s;
    }
    .fullscreen-btn:hover {
      background: #444;
    }
    .workspace-title {
      font-family: "Tourney", sans-serif;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 5px;
      padding: 18px 0 8px 0;
      background: none;
      color: #FFFFFF;
      z-index: 10;
      pointer-events: none; /* Prevent button overlap issues */
    }
  </style>

</head>
<body>
   <!-- <div class="workspace-title">ASHISH WORKSPACE</div> -->
   <button class="fullscreen-btn" id="fullscreen-btn">[ ]</button>
  <div class="container">
   <div style="display: flex; align-items: center;">
      <div id="clock">
        <span>1</span><span>2</span><span class="colon">:</span>
        <span>5</span><span>9</span><span class="colon">:</span>
        <span>4</span><span>7</span>
      </div>
      <div id="ampm">PM</div>
    </div>

    <div id="date"></div>
</div>
  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      hours = hours < 10 ? '0' + hours : String(hours);
      minutes = minutes < 10 ? '0' + minutes : String(minutes);
      seconds = seconds < 10 ? '0' + seconds : String(seconds);

      const timeDigits = [
        hours.charAt(0), hours.charAt(1), ':',
        minutes.charAt(0), minutes.charAt(1), ':',
        seconds.charAt(0), seconds.charAt(1)
      ];

      const spans = document.querySelectorAll('#clock span');
      spans.forEach((span, index) => {
        span.textContent = timeDigits[index];
      });
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Array of day and month names for formatting
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const monthNames = [ "January", "February", "March", "April", "May", "June", "July",
      "August", "September", "October", "November", "December" ];

    function updateClockAndDate() {
      const now = new Date();
      // Date formatting
      const day = dayNames[now.getDay()];
      const date = now.getDate();
      const month = monthNames[now.getMonth()];
      document.getElementById('date').textContent = `${day}, ${date} ${month}`;

      // 12-hour format conversion
      let hours = now.getHours();
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12;
      hours = hours ? hours : 12; // 0 becomes 12
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      hours = hours < 10 ? '0' + hours : String(hours);
      minutes = minutes < 10 ? '0' + minutes : String(minutes);
      seconds = seconds < 10 ? '0' + seconds : String(seconds);

      const timeDigits = [
        hours.charAt(0), hours.charAt(1), ':',
        minutes.charAt(0), minutes.charAt(1), ':',
        seconds.charAt(0), seconds.charAt(1)
      ];
      const spans = document.querySelectorAll('#clock span');
      spans.forEach((span, index) => {
        span.textContent = timeDigits[index];
      });
      document.getElementById('ampm').textContent = ampm;
    }

    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    // Blinking colons
    setInterval(() => {
      document.querySelectorAll('.colon').forEach(colon => {
        colon.classList.toggle('hidden');
      });
    }, 500);

    document.getElementById('fullscreen-btn').onclick = function() {
      const docElm = document.documentElement;
      if (docElm.requestFullscreen) {
        docElm.requestFullscreen();
      } else if (docElm.webkitRequestFullscreen) { // Safari
        docElm.webkitRequestFullscreen();
      } else if (docElm.msRequestFullscreen) { // IE11
        docElm.msRequestFullscreen();
      }
    };


  </script>
</body>
</html>
